name: Update README cards

on:
  schedule:
    - cron: "0 6 * * *" # Una vez al día (06:00 UTC)
  workflow_dispatch: # Ejecución manual desde la pestaña Actions
  push:
    paths:
      - ".github/workflows/readme-cards.yml" # Genera las tarjetas al cambiar este archivo

# Mínimo privilegio: solo necesita escribir contenido para hacer el commit de los SVG
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=dark&hide_border=true&bg_color=00000000&title_color=00F7FF&text_color=FFFFFF&locale=es
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push
